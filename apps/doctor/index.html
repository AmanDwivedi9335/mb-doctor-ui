<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Same policy as the patient app: send the bare origin cross-origin, the
         full URL same-origin, nothing on an HTTPS->HTTP downgrade. Never
         no-referrer (that broke ICICI checkout for the patient app). -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/src/assets/medibank-mark.png" />
    <title>MediBank for Doctors</title>
    <meta name="description" content="MediBank doctor portal: look up patients, record care, run your clinic." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
